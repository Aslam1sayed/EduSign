<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduSign — نظام مساعد لتعليم الطلاب الصم</title>
<meta name="description" content="EduSign: نظام مساعد لتعليم الطلاب الصم يحول شرح المعلم إلى نص فوري ورسوم توضيحية حية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&family=Amiri:wght@400;700&family=Inter:wght@400;500;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<style>
:root{
  --bg:#f5f8fb;--surface:#ffffff;--surface-2:#eef4f7;--text:#13233a;--muted:#55667d;
  --primary:#0f766e;--primary-2:#0e6ba8;--accent:#f59e0b;--on-primary:#ffffff;
  --border:#dbe4ec;--ill-a:#0f766e;--ill-b:#f59e0b;--ill-soft:#d5f5ef;
  --cap-bg:#0c1a2b;--cap-text:#ffffff;--cap-now:#fbbf24;
  --shadow:0 18px 40px -22px rgba(19,35,58,.35);--shadow-sm:0 6px 18px -12px rgba(19,35,58,.3);
  --radius:20px;--ease:cubic-bezier(.2,.8,.2,1);
}
html.hc{
  --bg:#000;--surface:#000;--surface-2:#0d0d0d;--text:#fff;--muted:#fff;
  --primary:#ffe600;--primary-2:#00e5ff;--accent:#00e5ff;--on-primary:#000;
  --border:#fff;--ill-a:#ffe600;--ill-b:#00e5ff;--ill-soft:#000;
  --cap-bg:#000;--cap-text:#fff;--cap-now:#ffe600;--shadow:none;--shadow-sm:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.75;font-size:16.5px;transition:background-color .35s,color .35s}
html.hc body{font-size:18px}
img,svg{max-width:100%}
a{color:var(--primary)}
h1,h2,h3{line-height:1.3;margin:0 0 .5em}
p{margin:0 0 1em}
.container{width:100%;max-width:1180px;margin-inline:auto;padding-inline:20px}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:10px;z-index:100;transition:top .2s}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--primary-2);outline-offset:3px;border-radius:8px}
html.hc :focus-visible{outline:4px solid #00e5ff}
section{scroll-margin-top:80px}
main{transition:opacity .25s}
main.switching{opacity:.25}

/* Header */
.site-header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;gap:14px;min-height:68px;position:relative;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.25rem;color:var(--text);text-decoration:none!important}
.brand svg{width:38px;height:38px}
nav ul{list-style:none;display:flex;gap:4px;margin:0;padding:0}
nav a{display:block;padding:8px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;transition:background .2s,color .2s}
nav a:hover{background:var(--surface-2);color:var(--text)}
.tools{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.tool{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 13px;font:inherit;font-size:.86rem;font-weight:500;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.tool svg{width:17px;height:17px}
.tool:hover{transform:translateY(-1px)}
.tool[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.nav-toggle{display:none;background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;width:42px;height:40px;cursor:pointer}
@media (max-width:1100px){
  .nav-toggle{display:inline-grid;place-items:center;order:3}
  nav{position:absolute;inset-inline:0;top:100%;background:var(--surface);border-bottom:1px solid var(--border);display:none;padding:10px 20px 16px;box-shadow:var(--shadow)}
  nav.open{display:block}
  nav ul{flex-direction:column}
}
@media (max-width:860px){.tool .lbl{display:none}.tool{padding:8px 10px}}
@media (max-width:640px){#startLbl{display:none}.btn.sm#btnStart{padding:9px 12px}}
@media (max-width:560px){.header-inner{flex-wrap:wrap;padding-block:8px;gap:8px}.nav-toggle{margin-inline-start:auto;order:2}.tools{order:5;width:100%;margin:0;justify-content:space-between}}
.selectwrap select{border:0;background:transparent;font:inherit;color:inherit;padding:0 2px;cursor:pointer;min-width:0}
.selectwrap select:focus-visible{outline-offset:6px}
.fpanel{position:absolute;inset-inline-end:20px;top:calc(100% + 8px);width:min(360px,calc(100vw - 40px));background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 100px);overflow:auto}
html.hc .fpanel{border:2px solid #fff}
.fpanel h3{margin:0;font-size:.95rem}.fpanel .fp-sep{padding-top:10px;border-top:1px solid var(--border)}
.fp-row{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted)}
.fp-ctl{display:flex;align-items:center;gap:10px}.fp-ctl input[type=range]{flex:1;accent-color:var(--primary)}
.fp-ctl output{min-width:44px;text-align:end;font-weight:700;color:var(--text);direction:ltr}
.fp-ctl input[type=color]{width:46px;height:34px;padding:2px;border:1px solid var(--border);border-radius:9px;background:var(--surface);cursor:pointer}
.fp-check{display:flex;gap:10px;align-items:center;font-size:.92rem;cursor:pointer}.fp-check input{width:18px;height:18px;accent-color:var(--primary)}
.meter{width:70px;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;display:inline-block}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#f59e0b);transition:width .08s linear}
.transcript{font-variant:var(--tr-variant,normal);font-family:var(--tr-font,inherit);font-size:var(--tr-size,1.22rem);color:var(--tr-color,var(--text));background:color-mix(in srgb,var(--surface-2) calc(var(--tr-op,100)*1%),transparent)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:14px;font:inherit;font-weight:700;cursor:pointer;border:1px solid transparent;text-decoration:none!important;transition:transform .25s var(--ease),box-shadow .25s,background .25s,color .25s}
.btn svg{width:20px;height:20px}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:var(--on-primary);box-shadow:0 10px 24px -12px var(--primary)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:8px 14px;font-size:.9rem;border-radius:11px}
.btn.big{padding:14px 26px;font-size:1.05rem}
.btn.stop{background:#b91c1c;color:#fff;box-shadow:0 10px 24px -12px #b91c1c}
html.hc .btn.primary{background:var(--primary);color:#000;border:2px solid #fff}
html.hc .btn.stop{background:#fff;color:#000;border:2px solid #ffe600}
html.hc .btn.ghost{border:2px solid #fff}
html.hc a{text-decoration:underline}

/* Hero */
.hero{position:relative;padding:54px 0 30px;overflow:hidden}
.blobs{position:absolute;inset:0;pointer-events:none;z-index:-1}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.38}
.b1{width:420px;height:420px;background:#99f6e4;top:-120px;inset-inline-start:-120px}
.b2{width:360px;height:360px;background:#bae6fd;bottom:-140px;inset-inline-end:-80px}
.b3{width:220px;height:220px;background:#fde68a;top:40%;inset-inline-start:45%;opacity:.25}
html[data-motion="lively"] .blob{animation:blobMove 14s ease-in-out infinite alternate}
html[data-motion="lively"] .b2{animation-duration:18s}
@keyframes blobMove{to{transform:translate(60px,40px) scale(1.15)}}
html.hc .blobs{display:none}
.hero-grid{display:grid;grid-template-columns:1.02fr 1fr;gap:46px;align-items:center}
@media (max-width:980px){.hero-grid{grid-template-columns:1fr;gap:34px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary);font-weight:700;font-size:.85rem;padding:6px 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--primary) 25%,transparent)}
html.hc .eyebrow{border:2px solid var(--primary)}
h1{font-size:clamp(2rem,4.4vw,3.2rem);margin:.45em 0 .4em;letter-spacing:-.01em}
.grad-text{background-image:linear-gradient(90deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;color:transparent}
[dir="rtl"] .grad-text{background-image:linear-gradient(270deg,var(--primary),var(--primary-2))}
html.hc .grad-text{background:none;color:var(--primary);-webkit-text-fill-color:var(--primary)}
.lead{font-size:1.12rem;color:var(--muted);max-width:56ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 26px}

.counter-card{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow-sm);max-width:520px}
html.hc .counter-card{border:2px solid #fff}
.counter-num{grid-row:span 2;font-size:clamp(2.2rem,5vw,2.9rem);font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1;min-width:2ch;transition:transform .3s var(--ease)}
.counter-num.bump{transform:scale(1.15)}
.counter-label{font-weight:700}
.counter-top{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.counter-meta{grid-column:1/-1;font-size:.82rem;color:var(--muted);border-top:1px dashed var(--border);padding-top:8px;margin-top:6px}
.live-dot{width:9px;height:9px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:live 1s infinite}
html.hc .live-dot{background:#ffe600}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}100%{box-shadow:0 0 0 9px rgba(22,163,74,0)}}

.scene-card{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
html.hc .scene-card{border:2px solid #fff}
.scene-wrap{position:relative;background:#e6f4f1}
.scene-wrap svg{display:block;width:100%;height:auto}
.scene-ctrl{position:absolute;top:12px;inset-inline-end:12px;display:flex;gap:8px}
.chip-dark{display:inline-flex;align-items:center;gap:6px;background:rgba(12,26,43,.82);color:#fff;border:0;border-radius:999px;padding:6px 12px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
.chip-dark svg{width:15px;height:15px}
html.hc .chip-dark{background:#000;border:2px solid #fff}
.caption-bar{background:var(--cap-bg);color:var(--cap-text);padding:14px 18px 12px}
html.hc .caption-bar{border-top:2px solid #fff}
.caption-text{font-size:clamp(1.05rem,2.2vw,1.3rem);font-weight:500;min-height:2.2em;line-height:1.6}
.caption-text .w{transition:opacity .2s,color .2s,background .2s;opacity:.45;border-radius:6px;padding:0 2px}
.caption-text .w.past{opacity:1}
.caption-text .w.now{opacity:1;color:#0c1a2b;background:var(--cap-now)}
html.hc .caption-text .w.now{color:#000}
.cap-progress{height:4px;background:rgba(255,255,255,.15);border-radius:4px;margin-top:10px;overflow:hidden}
.cap-progress span{display:block;height:100%;width:0;background:var(--cap-now)}
.scene-foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;padding:10px 18px;font-size:.82rem;color:var(--muted);background:var(--surface)}
.scene-foot b{color:var(--primary)}

/* scene colors */
.sc-wall{fill:url(#gWall)}.sc-floor{fill:#cfe3ea}.sc-window{fill:#f8fdff;stroke:#b9d6e0;stroke-width:4}
.sc-frame{fill:#1f3550}.sc-screen{fill:#10263f}.sc-skin{fill:#f1c6a2}.sc-hair{fill:#2b1d16}.sc-shirt{fill:#0f766e}
.sc-arm{fill:none;stroke:#0d5f58;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.sc-panel{fill:#f3fbf9}.sc-desk{fill:#c48a55}.sc-st1{fill:#f59e0b}.sc-st2{fill:#6366f1}.sc-eye{fill:#2b1d16}.sc-mouth{fill:#9f3a3a}
.sc-live{fill:#ef4444}.sc-txt{fill:#cde4f0;font:700 12px "IBM Plex Sans Arabic",sans-serif}
.sc-book{fill:#fff;stroke:#b9c8d6;stroke-width:2}
html.hc .sc-wall,html.hc .sc-floor,html.hc .sc-screen,html.hc .sc-panel{fill:#000}
html.hc .sc-window,html.hc .sc-frame{fill:#000;stroke:#fff;stroke-width:3}
html.hc .sc-shirt,html.hc .sc-st1{fill:#ffe600}html.hc .sc-st2{fill:#00e5ff}
html.hc .sc-arm{stroke:#ffe600}html.hc .sc-skin{fill:#fff}html.hc .sc-hair,html.hc .sc-eye,html.hc .sc-mouth{fill:#000}
html.hc .sc-desk{fill:#fff}html.hc .sc-txt{fill:#fff}html.hc .scene-wrap{background:#000}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px}
.stat b{display:block;font-size:1.55rem;color:var(--primary);line-height:1.2}
.stat span{font-size:.88rem;color:var(--muted)}
html.hc .stat{border:2px solid #fff}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}

/* Sections */
.section{padding:84px 0}
.section.alt{background:var(--surface-2)}
html.hc .section.alt{border-block:2px solid #fff}
.sec-head{text-align:center;max-width:760px;margin:0 auto 40px}
.sec-head h2{font-size:clamp(1.6rem,3.2vw,2.3rem);margin-top:.5em}
.sec-head p{color:var(--muted);font-size:1.05rem}

/* Demo app */
.app{background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
html.hc .app{border:2px solid #fff}
.app-bar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface-2);font-size:.85rem}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#f87171}.dots i:nth-child(2){background:#fbbf24}.dots i:nth-child(3){background:#34d399}
.app-title{font-weight:700;direction:ltr}
.net{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:#16a34a}
.net.off::before{background:#f59e0b}
.app-controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:18px}
.select{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
select,input[type="text"],input[type="search"]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 12px;min-width:0}
html.hc select,html.hc input{border:2px solid #fff}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;padding:6px 12px;border-radius:999px;background:var(--surface-2)}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.listening .dot{background:#ef4444;animation:live 1s infinite}
.app-controls .btn.ghost{margin-inline-start:auto}
.notice{margin:0 18px 14px;padding:12px 16px;border-radius:12px;background:#fff7e6;border:1px solid #fcd34d;color:#7a4b00;font-size:.93rem}
html.hc .notice{background:#000;color:#fff;border:2px solid #ffe600}
.app-body{display:grid;grid-template-columns:1.15fr 1fr;border-top:1px solid var(--border)}
.panel{padding:18px;min-width:0}
.panel+.panel{border-inline-start:1px solid var(--border)}
.panel h3{font-size:.95rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
@media (max-width:860px){.app-body{grid-template-columns:1fr}.panel+.panel{border-inline-start:0;border-top:1px solid var(--border)}}
.transcript{min-height:220px;max-height:320px;overflow:auto;font-size:1.22rem;line-height:1.95;padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border)}
.transcript p{margin:0 0 .5em}
.transcript .ph{color:var(--muted);font-size:1rem}
.transcript .interim{opacity:.6}
mark.term{background:color-mix(in srgb,var(--accent) 32%,transparent);color:inherit;border-radius:7px;padding:0 5px;font-weight:700;cursor:pointer;transition:background .2s}
mark.term:hover{background:color-mix(in srgb,var(--accent) 55%,transparent)}
html.hc mark.term{background:#ffe600;color:#000}
.type-form{margin-top:14px}
.type-form label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.type-form .row{display:flex;gap:8px}
.type-form input{flex:1}
.samples{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sample{font:inherit;font-size:.8rem;background:none;border:1px dashed var(--border);color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer}
.sample:hover{color:var(--primary);border-color:var(--primary)}
.stage{position:relative;aspect-ratio:1/1;max-width:300px;margin:0 auto;border-radius:22px;background:radial-gradient(circle at 50% 40%,var(--surface),var(--surface-2));border:1px solid var(--border);display:grid;place-items:center;overflow:hidden}
html.hc .stage{background:#000;border:2px solid #fff}
.stage-svg{width:82%;height:82%}
.stage-ph{text-align:center;color:var(--muted);font-size:.92rem;padding:20px}
.stage-ph svg{width:70px;height:70px;opacity:.5;display:block;margin:0 auto 8px}
.stage.pop .stage-svg{animation:fadeIn .45s var(--ease)}
html[data-motion="lively"] .stage.pop .stage-svg{animation:popIn .65s cubic-bezier(.34,1.56,.64,1)}
@keyframes fadeIn{from{opacity:0;transform:scale(.96)}}
@keyframes popIn{0%{opacity:0;transform:scale(.4) rotate(-12deg)}100%{opacity:1;transform:none}}
.stage-info{text-align:center;margin-top:14px;min-height:84px}
.term-ar{font-size:1.6rem;font-weight:700;line-height:1.3}
.term-en{font-size:1.05rem;color:var(--muted);direction:ltr}
.dbadge{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--d);background:color-mix(in srgb,var(--d) 12%,transparent)}
html.hc .dbadge{color:#fff;background:#000;border:1px solid #fff}
.history{padding:16px 18px 20px;border-top:1px solid var(--border)}
.history h3{font-size:.95rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:36px}
.chips .empty{color:var(--muted);font-size:.9rem}
.hchip{font:inherit;font-size:.88rem;display:inline-flex;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:5px 12px;cursor:pointer;transition:transform .2s}
.hchip:hover{transform:translateY(-2px)}
.hchip i{width:8px;height:8px;border-radius:50%;background:var(--d)}
html[data-motion="lively"] .hchip.new{animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}

.dict{margin-top:34px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:22px}
html.hc .dict{border:2px solid #fff}
.dict-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.dict-head h3{margin:0}
.pill{font-size:.82rem;font-weight:700;color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent);padding:4px 12px;border-radius:999px}
html.hc .pill{border:1px solid #fff}
.dict-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}
.dict-tools input{flex:1 1 240px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:inherit;font-size:.85rem;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;transition:all .2s}
.tab[aria-selected="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.dict-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:360px;overflow:auto;padding:2px}
.dterm{font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:start;background:var(--surface-2);border:1px solid var(--border);border-inline-start:4px solid var(--d);border-radius:12px;padding:8px 12px;cursor:pointer;color:var(--text);transition:transform .2s,box-shadow .2s}
.dterm:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}

/* ========== NORMALIZATION & INDEX ========== */
function normAr(s){return s.replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي');}
function norm(s){return normAr(String(s).toLowerCase()).replace(/[^a-z0-9\u0621-\u064A]+/g,' ').trim();}
const INDEX=new Map();let MAXL=1;
const PFX=['','ال','و','وال','بال','فال','كال','ب','ل','ف'];
function addKey(k,t){if(k&&!INDEX.has(k))INDEX.set(k,t);}
TERMS.forEach(t=>{
  const a=norm(t.ar);const words=a.split(' ');MAXL=Math.max(MAXL,words.length);
  const bases=new Set([a]);
  if(words[0].startsWith('ال')&&words[0].length>3)bases.add([words[0].slice(2)].concat(words.slice(1)).join(' '));
  if(words.length>1)bases.add(words.map(w=>w.startsWith('ال')?w:'ال'+w).join(' '));
  if(words.length===1){const w=words[0];bases.add(w.endsWith('ه')?w.slice(0,-1)+'ات':w+'ات');}
  bases.forEach(b=>{PFX.forEach(p=>addKey(p+b,t));addKey('لل'+(b.startsWith('ال')?b.slice(2):b),t);});
  const e=norm(t.en);const ew=e.split(' ');MAXL=Math.max(MAXL,ew.length);const last=ew[ew.length-1];const head=ew.slice(0,-1);
  [last,last+'s',last+'es',last.endsWith('y')?last.slice(0,-1)+'ies':null].forEach(v=>{if(v)addKey(head.concat(v).join(' '),t);});
});
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function analyze(text){
  const tokens=text.split(/\s+/).filter(Boolean);const nt=tokens.map(norm);const out=[];const found=[];let i=0;
  while(i<tokens.length){let m=null,len=0;
    for(let L=Math.min(MAXL,tokens.length-i);L>=1;L--){const key=nt.slice(i,i+L).filter(Boolean).join(' ');if(key&&INDEX.has(key)){m=INDEX.get(key);len=L;break;}}
    if(m){out.push('<mark class="term" data-id="'+m.id+'">'+esc(tokens.slice(i,i+len).join(' '))+'</mark>');found.push(m);i+=len;}
    else{out.push(esc(tokens[i]));i++;}}
  return {html:out.join(' '),terms:found};
}

/* ========== COUNTER (persistent, ticks every second) ========== */
const CKEY='edusign.sessions.v1';
let shownCount=-1,globalCount=null;
const readS=()=>store.get(CKEY,{count:0,last:null});
function incrementSession(){const s=readS();s.count++;s.last=Date.now();store.set(CKEY,s);
  if(CONFIG.globalCounterEndpoint){fetch(CONFIG.globalCounterEndpoint,{method:'POST'}).then(r=>r.json()).then(j=>{if(j&&typeof j.count==='number')globalCount=j.count;}).catch(()=>{});}
  updateCounterUI();}
function animateNum(el,from,to){if(reduced||from<0){el.textContent=fmtN(to);return;}const st=performance.now(),dur=700;
  (function step(n){const k=Math.min(1,(n-st)/dur);el.textContent=fmtN(Math.round(from+(to-from)*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(step);})(st);
  el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),300);}
function updateCounterUI(force){
  const s=readS();const val=globalCount!==null?globalCount:s.count;const el=$('#counterNum');
  if(val!==shownCount){animateNum(el,shownCount,val);shownCount=val;}else if(force){el.textContent=fmtN(val);}
  let lastTxt;
  if(!s.last)lastTxt=t('counter_never');
  else{const sec=Math.round((s.last-Date.now())/1000);const rtf=new Intl.RelativeTimeFormat(lang,{numeric:'auto'});
    const a=Math.abs(sec);lastTxt=t('counter_last')+': '+(a<60?rtf.format(sec,'second'):a<3600?rtf.format(Math.round(sec/60),'minute'):a<86400?rtf.format(Math.round(sec/3600),'hour'):rtf.format(Math.round(sec/86400),'day'));}
  $('#counterLast').textContent=lastTxt;
  $('#counterScope').textContent=globalCount!==null?t('scope_global'):t('scope_local');
}

const CUES=[
 {icon:'bolt',ar:'مرحبًا بكم، درس اليوم عن الطاقة',en:'Welcome! Today’s lesson is about energy',pose:[140,-95,40,-85]},
 {icon:'atom',ar:'الذرة هي أصغر وحدة في المادة',en:'The atom is the smallest unit of matter',pose:[120,-40,60,-140]},
 {icon:'leaf',ar:'النبات يصنع غذاءه بالبناء الضوئي',en:'Plants make their food by photosynthesis',pose:[150,-120,30,-60]},
 {icon:'triangle',ar:'المثلث له ثلاث زوايا وثلاثة أضلاع',en:'A triangle has three angles and three sides',pose:[110,-30,70,-150]},
 {icon:'cloud',ar:'الماء يتبخر ثم يتكاثف ويهطل مطرًا',en:'Water evaporates, condenses, then falls as rain',pose:[160,-80,20,-100]},
 {icon:'bulb',ar:'أحسنتم! لنراجع ما تعلمناه معًا',en:'Well done! Let’s review what we learned',pose:[130,-110,50,-70]}
];
const CUE_MS=3600,TOTAL=CUE_MS*CUES.length,SPEAK=.86;
let elapsed=0,playing=!reduced,lastCue=-1,lastNow=performance.now(),sceneVisible=true;
const armL=$('#armL'),armR=$('#armR'),handL=$('#handL'),handR=$('#handR'),mouth=$('#mouth'),capEl=$('#caption'),ill=$('#sceneIll'),st1=$('#st1'),st2=$('#st2');
const SL=[212,170],SR_=[268,170],L1=44,L2=40,rad=d=>d*Math.PI/180;
function arm(sh,a1,a2){const e=[sh[0]+L1*Math.cos(rad(a1)),sh[1]+L1*Math.sin(rad(a1))];const h=[e[0]+L2*Math.cos(rad(a2)),e[1]+L2*Math.sin(rad(a2))];
  return {d:`M${sh[0]} ${sh[1]}L${e[0].toFixed(1)} ${e[1].toFixed(1)}L${h[0].toFixed(1)} ${h[1].toFixed(1)}`,h};}
let capSpans=[];
function renderCaption(force){
  const t0=elapsed%TOTAL;const ci=Math.floor(t0/CUE_MS);
  if(ci!==lastCue||force){lastCue=ci;const c=CUES[ci];
    capEl.lang=lang;capEl.innerHTML=c[lang].split(' ').map(w=>'<span class="w">'+esc(w)+'</span>').join(' ');capSpans=Array.from(capEl.children);
    ill.innerHTML=ICONS[c.icon]();}
}
function frame(now){
  const dt=Math.min(100,now-lastNow);lastNow=now;
  if(playing&&sceneVisible)elapsed+=dt;
  const t0=elapsed%TOTAL;const ci=Math.floor(t0/CUE_MS);const local=(t0%CUE_MS)/CUE_MS;
  renderCaption(false);
  const n=capSpans.length;const sp=local/SPEAK;const wf=sp*n;const wi=Math.min(n-1,Math.floor(wf));
  const beat=local<SPEAK?Math.sin(Math.PI*(wf-Math.floor(wf))):0;
  capSpans.forEach((s,i)=>{s.className='w'+(local>=SPEAK||i<wi?' past':i===wi?' now':'');});
  $('#capProg').style.width=(t0/TOTAL*100).toFixed(2)+'%';
  const prev=CUES[(ci+CUES.length-1)%CUES.length].pose,cur=CUES[ci].pose;
  let k=Math.min(1,local/.16);k=k*k*(3-2*k);
  const p=cur.map((v,i)=>prev[i]+(v-prev[i])*k);
  const sway=Math.sin(elapsed/420)*5;
  const L=arm(SL,p[0]+sway,p[1]+22*beat),R=arm(SR_,p[2]-sway,p[3]-22*beat);
  armL.setAttribute('d',L.d);armR.setAttribute('d',R.d);
  handL.setAttribute('cx',L.h[0].toFixed(1));handL.setAttribute('cy',L.h[1].toFixed(1));
  handR.setAttribute('cx',R.h[0].toFixed(1));handR.setAttribute('cy',R.h[1].toFixed(1));
  mouth.setAttribute('ry',(1.6+4.2*beat).toFixed(2));
  st1.setAttribute('transform',`rotate(${(beat*2.5).toFixed(2)} 112 330)`);
  st2.setAttribute('transform',`rotate(${(-beat*2).toFixed(2)} 520 330)`);
  requestAnimationFrame(frame);
}

/* ===== Mic pipeline: browser noiseSuppression/AGC + high-pass/low-pass + compressor + level meter ===== */
let micStream=null,actx=null,meterRAF=0;
function closeMic(){cancelAnimationFrame(meterRAF);if(micStream){micStream.getTracks().forEach(tr=>tr.stop());micStream=null;}
  if(actx){try{actx.close();}catch(e){}actx=null;}$('#meterBar').style.width='0';}
async function openMic(){
  closeMic();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return;
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{noiseSuppression:!!prefs.ns,echoCancellation:true,autoGainControl:!!prefs.agc,channelCount:1}});
    if(!listening){closeMic();return;}
    const AC=window.AudioContext||window.webkitAudioContext;actx=new AC();
    const src=actx.createMediaStreamSource(micStream);
    const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=prefs.ns?110:20;
    const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=prefs.ns?7500:20000;
    const comp=actx.createDynamicsCompressor();comp.threshold.value=prefs.agc?-40:0;comp.knee.value=24;comp.ratio.value=prefs.agc?6:1;comp.attack.value=.01;comp.release.value=.25;
    const an=actx.createAnalyser();an.fftSize=512;const buf=new Uint8Array(an.fftSize);
    src.connect(hp);hp.connect(lp);lp.connect(comp);comp.connect(an);
    const bar=$('#meterBar');
    const loop=()=>{an.getByteTimeDomainData(buf);let m=0;for(let i=0;i<buf.length;i++){const v=Math.abs(buf[i]-128)/128;if(v>m)m=v;}
      bar.style.width=Math.min(100,Math.round(m*140))+'%';meterRAF=requestAnimationFrame(loop);};loop();
  }catch(err){/* non-fatal: recognition keeps working with the browser's default mic */}
}

function startLesson(){
  showNotice('');incrementSession();burst($('#btnStart'));
  if(!SRApi){showNotice(t('unsupported'));setStatus('st_text');$('#typeInput').focus();return;}
  try{
    rec=new SRApi();rec.lang=$('#recLang').value;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
    rec.onresult=e=>{let im='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)commit(r[0].transcript);else im+=r[0].transcript;}if(im)interim(im);};
    rec.onerror=e=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){showNotice(t('err_mic'));stopLesson();}
      else if(e.error==='network'){showNotice(t('err_network'));stopLesson();}
      else if(e.error==='no-speech'){setStatus('st_nospeech');}
      else if(e.error!=='aborted'){showNotice(t('err_generic')+e.error);}
    };
    rec.onend=()=>{if(listening){try{rec.start();}catch(err){}}};
    rec.start();listening=true;sessionStart=Date.now();updateStartBtn();setStatus('st_listen',' 00:00');openMic();
  }catch(err){showNotice(t('err_generic')+err.message);listening=false;updateStartBtn();}
}

  next();});
/* question / homework / important detection */
const KQ=/[?؟]|^\s*(هل|ماذا|لماذا|كيف|متى|أين|اين|كم)\s|^\s*(why|how|what|which|who|when|where)\b/i,KH=/(الواجب|واجب|اكتبوا|حلوا|احفظوا|للغد|homework|assignment|write down|submit|due )/i,KI=/(لاحظوا|لاحظ|مهم|انتبهوا|تذكروا|ملاحظة|important|note that|remember|pay attention|key point)/i;
const KL={q:()=>lx('سؤال','Question'),hw:()=>lx('واجب','Homework'),imp:()=>lx('مهم','Important')};
function kindOf(t){if(KH.test(t))return 'hw';if(KI.test(t))return 'imp';if(KQ.test(t))return 'q';return '';}
/* numbers, dates, equations strip */
var nums=[];const numStrip=document.createElement('div');numStrip.className='nums';numStrip.hidden=true;$('#typeForm').before(numStrip);
function addNums(t){const re=/\d{1,4}[\/.\-]\d{1,2}[\/.\-]\d{1,4}|[\p{L}\d]+\s?[=+×÷^]\s?[\p{L}\d.]+(?:\s?[=+×÷^-]\s?[\p{L}\d.]+)*|[\d٠-٩]+(?:[.,٫][\d٠-٩]+)?\s?%?/gu;
  (t.match(re)||[]).map(x=>x.trim()).filter(x=>x.length>1||/[%]/.test(x)).forEach(x=>{nums=nums.filter(n=>n!==x);nums.unshift(x);});nums=nums.slice(0,8);renderNums();}
function renderNums(){numStrip.hidden=!nums.length;numStrip.innerHTML=nums.length?'<span class="nt">'+lx('أرقام ومعادلات:','Numbers & equations:')+'</span>'+nums.map(n=>`<b>${esc(n)}</b>`).join(''):'';}
/* easy reading */
function easySplit(h){return h.replace(/([،,؛;.!؟?])(\s+)/g,'$1<br>').replace(/\s(ثم|لأن|لكن|حيث|عندما|بينما|and|but|because|then|which|when|while)\s/gi,'<br>$1 ');}
function toggleEasy(b){prefs.easy=!prefs.easy;savePrefs();transcript.classList.toggle('easy',prefs.easy);b.setAttribute('aria-pressed',!!prefs.easy);fsRender();}
transcript.classList.toggle('easy',!!prefs.easy);{const eb=document.querySelector('[data-act=easy]');if(eb)eb.setAttribute('aria-pressed',!!prefs.easy);}
/* extractive summary (on-device, not AI) */
const sumBox=document.createElement('div');sumBox.className='sum';sumBox.hidden=true;document.querySelector('.app-controls').after(sumBox);var sumText='';
function doSum(){if(!segs.length){toast(lx('لا يوجد نص بعد','No text yet'));return;}
  const S=segsText().split(/(?<=[.!؟?])\s+|\n+/).map(x=>x.trim()).filter(x=>x.split(/\s+/).length>3);
  const top=S.map((s,i)=>({s,i,v:analyze(s).terms.length*3+(kindOf(s)?2:0)+Math.min(s.split(/\s+/).length,20)/10})).sort((a,b)=>b.v-a.v).slice(0,5).sort((a,b)=>a.i-b.i).map(x=>x.s);
  const tm=history.slice().reverse().map(t=>lang==='ar'?t.ar:t.en),qs=S.filter(x=>kindOf(x));
  const sec=(h,a)=>a.length?`<h4>${h}</h4><ul>${a.map(x=>`<li dir="auto">${esc(x)}</li>`).join('')}</ul>`:'';
  sumBox.innerHTML=`<b>${lx('ملخص الحصة','Lesson summary')}</b>`+sec(lx('المصطلحات','Terms'),tm)+sec(lx('أهم النقاط','Key points'),top)+sec(lx('أسئلة وواجبات وتنبيهات','Questions, homework & notes'),qs)+sec(lx('أرقام ومعادلات','Numbers & equations'),nums)+
   `<p><small>${lx('تلخيص آلي بسيط يعمل على جهازك، وليس ذكاءً اصطناعيًا.','A simple on-device summary, not AI.')}</small></p><button type="button" class="abtn p" id="sumSave">${lx('حفظ في ملاحظاتي','Save to My notes')}</button> <button type="button" class="abtn" id="sumClose">${lx('إغلاق','Close')}</button>`;
  sumText=lx('ملخص الحصة','Lesson summary')+'\n\n'+[tm.join('، '),top.join('\n'),qs.join('\n'),nums.join(' | ')].filter(Boolean).join('\n\n');sumBox.hidden=false;}
sumBox.addEventListener('click',e=>{if(e.target.id==='sumClose')sumBox.hidden=true;if(e.target.id==='sumSave'){notes.unshift({id:Date.now(),title:lx('ملخص: ','Summary: ')+segsText().replace(/\s+/g,' ').slice(0,30),body:sumText,at:Date.now()});store.set('edusign.notes',notes);renderNotes();updMy(true);}});
new MutationObserver(()=>{renderWords();renderNums();}).observe(root,{attributes:true,attributeFilter:['lang']});
renderWords();renderNums();updMy();

/* dictionary */
let dom='all';
function renderTabs(){$('#domainTabs').innerHTML=['all'].concat(DOMAINS).map(d=>`<button class="tab" role="tab" data-d="${d}" aria-selected="${d===dom}">${esc(d==='all'?t('all'):t('d_'+d))}</button>`).join('');}
$('#domainTabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;dom=b.dataset.d;renderTabs();renderDict();});
function renderDict(){const q=norm($('#dictSearch').value||'');
  const list=TERMS.filter(x=>(dom==='all'||x.domain===dom)&&(!q||norm(x.ar).includes(q)||norm(x.en).includes(q)));
  $('#dictGrid').innerHTML=list.map(x=>`<button class="dterm" data-id="${x.id}" style="--d:${DOM_COLOR[x.domain]}"><span class="ar" lang="ar">${esc(x.ar)}</span><span class="en" lang="en">${esc(x.en)}</span></button>`).join('');
  $('#dictCount').textContent=t('dict_count').replace('{n}',fmtN(list.length));}
$('#dictSearch').addEventListener('input',renderDict);

/* confetti (lively mode only) */
function burst(el){if(root.dataset.motion!=='lively'||reduced||!el.animate)return;const r=el.getBoundingClientRect();const cols=['#0f766e','#f59e0b','#0e6ba8','#db2777','#7c3aed'];
  for(let i=0;i<18;i++){const s=document.createElement('span');s.className='confetti';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.background=cols[i%cols.length];document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,d=60+Math.random()*90;
    s.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-40}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:800+Math.random()*500,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>s.remove();}}

/* ========== TIMELINE ========== */
const steps=$$('.step');let userTouched=false;
function activate(i,scroll){steps.forEach((s,j)=>{s.classList.toggle('active',j===i);s.classList.toggle('done',j<i);s.setAttribute('aria-expanded',j===i);});
  $('#timeline').style.setProperty('--prog',steps.length>1?i/(steps.length-1):0);
  if(scroll&&matchMedia('(max-width:820px)').matches)steps[i].scrollIntoView({behavior:reduced?'auto':'smooth',inline:'center',block:'nearest'});}
steps.forEach((s,i)=>{
  s.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){userTouched=true;activate(i,false);}});
  s.addEventListener('click',()=>{userTouched=true;activate(i,true);});
  s.addEventListener('focus',()=>{userTouched=true;activate(i,false);});
  s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(i,true);}});
});
activate(0,false);
let tlIdx=0,tlVisible=false;
if('IntersectionObserver'in window)new IntersectionObserver(es=>{tlVisible=es[0].isIntersecting;},{threshold:.4}).observe($('#timeline'));
setInterval(()=>{if(!userTouched&&tlVisible&&!reduced){tlIdx=(tlIdx+1)%steps.length;activate(tlIdx,false);}},3800);

/* ========== REVEAL ========== */
if('IntersectionObserver'in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});$$('.reveal').forEach(el=>io.observe(el));}
else $$('.reveal').forEach(el=>el.classList.add('in'));

/* ========== INIT ========== */
$('#ghLink').href=CONFIG.githubUrl;
$('#year').textContent=new Date().getFullYear();
$('#statTerms').textContent=TERMS.length;$('#statIcons').textContent=Object.keys(ICONS).length;
applyHC(!!prefs.hc);applyMotion(prefs.motion==='lively'?'lively':'calm');
applyLang(lang,false);
requestAnimationFrame(t0=>{lastNow=t0;frame(t0);});
})();
</script>
</body>
